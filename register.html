<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Create your NaijaSwap account - Global Marketplace & B2B Trade Desk by RadiantWaves Media Ltd">
<meta name="theme-color" content="#1a1a2e">
<title>Register | NaijaSwap</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --primary: #ff6b35; --primary-light: #ff8f66; --primary-dark: #e55a2b;
  --secondary: #0f3460; --dark: #1a1a2e; --light: #f5f7fa;
  --success: #28a745; --danger: #dc3545; --white: #ffffff; --gray: #6c757d;
  --shadow: 0 4px 20px rgba(0,0,0,0.15); --radius: 12px; --transition: all 0.3s ease;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, #ff6b35 0%, #ff8f66 25%, #f5f7fa 55%, #ffffff 100%);
  background-size: 400% 400%;
  animation: gradientShift 15s ease infinite;
  color: var(--dark); min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
@keyframes gradientShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}
body::before {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(circle at 20% 30%, rgba(255,107,53,0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 70%, rgba(15,52,96,0.06) 0%, transparent 50%);
  pointer-events: none; z-index: 0;
}
.auth-container {
  background: var(--white); border-radius: var(--radius); padding: 3rem;
  box-shadow: var(--shadow); width: 100%; max-width: 420px; margin: 2rem;
  position: relative; z-index: 1;
}
.logo-center { text-align: center; margin-bottom: 1.5rem; font-size: 2rem; font-weight: 800; }
.logo-center span { background: linear-gradient(90deg, var(--primary), var(--primary-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
.auth-container h1 { text-align: center; margin-bottom: 0.5rem; color: var(--dark); font-size: 1.5rem; }
.auth-container p { text-align: center; color: var(--gray); margin-bottom: 2rem; font-size: 0.9rem; }
input, select {
  width: 100%; padding: 0.9rem 1rem; border: 2px solid #e8e8e8; border-radius: 10px;
  font-size: 1rem; font-family: inherit; background: var(--white); transition: var(--transition); outline: none; margin-bottom: 1rem;
}
input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(255,107,53,0.1); }
label { display: block; font-weight: 600; color: var(--dark); margin-bottom: 0.4rem; font-size: 0.95rem; }
.btn {
  width: 100%; padding: 0.9rem; border-radius: 10px; font-weight: 700; font-size: 1rem;
  border: none; cursor: pointer; transition: var(--transition); margin-top: 0.5rem; font-family: inherit;
}
.btn-primary {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: var(--white); box-shadow: 0 4px 20px rgba(255,107,53,0.35);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,107,53,0.5); }
.btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
.btn-google {
  background: var(--white); color: var(--dark); border: 2px solid #e0e0e0;
  display: flex; align-items: center; justify-content: center; gap: 0.5rem;
}
.btn-google:hover { border-color: var(--primary); background: rgba(255,107,53,0.05); }
.divider { display: flex; align-items: center; margin: 1.5rem 0; color: var(--gray); font-size: 0.85rem; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e0e0e0; }
.divider::before { margin-right: 1rem; }
.divider::after { margin-left: 1rem; }
.toggle-auth { text-align: center; margin-top: 1.5rem; color: var(--gray); font-size: 0.9rem; }
.toggle-auth a { color: var(--primary); font-weight: 600; cursor: pointer; text-decoration: none; }
.toggle-auth a:hover { text-decoration: underline; }
.error-msg {
  background: rgba(220,53,69,0.1); color: var(--danger); padding: 0.8rem 1rem;
  border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; border-left: 3px solid var(--danger);
}
.error-msg.show { display: block; }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-top-color: var(--white); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 8px; }
@keyframes spin { to { transform: rotate(360deg); } }
.toast {
  position: fixed; bottom: 2rem; right: 2rem; padding: 1rem 1.5rem;
  background: var(--dark); color: #fff; border-radius: 10px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 0.75rem;
  transform: translateY(100px); opacity: 0; transition: all 0.3s; z-index: 3000;
}
.toast.show { transform: translateY(0); opacity: 1; }
.toast.success { background: var(--success); }
</style>
</head>
<body>

<div class="auth-container">
  <div class="logo-center">&#128293; <span>NaijaSwap</span></div>
  <h1>Create Account</h1>
  <p>Join NaijaSwap — Buy, Sell & Trade Globally</p>

  <div id="errorMsg" class="error-msg"></div>

  <label>Full Name</label>
  <input type="text" id="signupName" placeholder="John Doe">

  <label>Email</label>
  <input type="email" id="signupEmail" placeholder="your@email.com">

  <label>Password</label>
  <input type="password" id="signupPassword" placeholder="Min 6 characters">

  <label>Confirm Password</label>
  <input type="password" id="signupConfirm" placeholder="Confirm password">

  <button class="btn btn-primary" id="signupBtn" onclick="handleSignup()">
    <span id="signupText">Create Account</span>
  </button>

  <div class="divider">or</div>

  <button class="btn btn-google" onclick="handleGoogleSignup()">
    &#128269; Sign up with Google
  </button>

  <div class="toggle-auth">
    Already have an account? <a href="login.html">Sign In</a>
  </div>
</div>

<div class="toast" id="toast"><span id="toastIcon">&#9989;</span><span id="toastMessage">Done</span></div>

<script>
const SUPABASE_URL = 'https://kysnaeklegcazdwfgxysy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt5c25hZWtsZWdjYXpkd2ZneHN5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MjI4MjksImV4cCI6MjA5OTA5ODgyOX0.SQiVyeqQs9lcwree7QRjLqW0Pmbrz2Tq_2MEtwvutsk';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);
}

function showToast(msg, type) {
  const toast = document.getElementById('toast');
  const icon = document.getElementById('toastIcon');
  toast.className = 'toast ' + (type === 'success' ? 'success' : '');
  icon.textContent = type === 'success' ? '\u2705' : '\u26A0\uFE0F';
  document.getElementById('toastMessage').textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 4000);
}

async function handleSignup() {
  const name = document.getElementById('signupName').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const confirm = document.getElementById('signupConfirm').value;
  const btn = document.getElementById('signupBtn');
  const text = document.getElementById('signupText');

  if (!name || !email || !password) { showError('Please fill in all fields'); return; }
  if (password.length < 6) { showError('Password must be at least 6 characters'); return; }
  if (password !== confirm) { showError('Passwords do not match'); return; }

  btn.disabled = true;
  text.innerHTML = '<span class="spinner"></span>Creating account...';

  try {
    const { data, error } = await supabaseClient.auth.signUp({ email, password, options: { data: { full_name: name } } });
    if (error) throw error;

    // Create profile in profiles table
    if (data.user) {
      await supabaseClient.from('profiles').upsert({
        id: data.user.id,
        email: email,
        full_name: name,
        role: 'user',
        created_at: new Date().toISOString(),
        updated_at: new Date().toISOString()
      });
      
      // Store user in localStorage same format as index.html
      localStorage.setItem('naijaswap_user', JSON.stringify({
        uid: data.user.id,
        id: data.user.id,
        email: email,
        displayName: name
      }));
    }

    showToast('Account created! Redirecting...', 'success');
    setTimeout(() => window.location.href = 'index.html', 1500);
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
    text.textContent = 'Create Account';
  }
}

async function handleGoogleSignup() {
  try {
    const { data, error } = await supabaseClient.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + '/index.html' }
    });
    if (error) throw error;
    // OAuth redirect handles the rest
  } catch (err) {
    showError(err.message);
  }
}

document.getElementById('signupConfirm').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') handleSignup();
});
</script>
</body>
</html>
